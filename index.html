    <!-- Existing Boot Splash Styles -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        background: #09090b;
        opacity: 1;
        transition: opacity 0.18s ease, visibility 0.18s ease;
        pointer-events: none;
      }

      #boot-splash img {
        display: block;
        width: min(248px, 64vw);
        height: auto;
        animation: boot-logo-in 0.45s ease-out both;
      }

      #boot-splash span {
        width: 20px;
        height: 20px;
        border: 1.5px solid rgba(167, 139, 250, 0.22);
        border-top-color: #a78bfa;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }

      #boot-splash.is-ready {
        opacity: 0;
        visibility: hidden;
      }

      @keyframes boot-logo-in {
        from {
          opacity: 0.5;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot-splash,
        #boot-splash * {
          animation: none !important;
          transition: none !important;
        }

        #boot-splash img {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" aria-hidden="true">

  </body>
